# Apply through scripts/setup-jwt-demo.sh; the issuer placeholder must be replaced.
# This creates a separate JWT-protected path on the EXISTING Gateway and OpenShift Route.
# /jwt/ws/data/all is rewritten upstream to /ws/data/all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parks-jwt
  namespace: rhcl-parks-demo
spec:
  parentRefs:
    - name: parks-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /jwt
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: parks-api
          port: 8080
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: parks-jwt-auth
  namespace: rhcl-parks-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: parks-jwt
  rules:
    authentication:
      keycloak-service-token:
        jwt:
          # Use the internal JWKS service because the sandbox OpenShift Route
          # has an untrusted public certificate. Production must secure this
          # back-channel with TLS/mTLS and trust a real CA.
          jwksUrl: http://parks-keycloak.rhcl-parks-demo.svc.cluster.local:8080/realms/parks/protocol/openid-connect/certs
          audiences:
            - parks-api
        credentials:
          authorizationHeader:
            prefix: Bearer
    authorization:
      expected-keycloak-issuer:
        patternMatching:
          patterns:
            - selector: auth.identity.iss
              operator: eq
              value: "__KC_ISSUER__"
    response:
      success:
        filters:
          identity:
            json:
              properties:
                userid:
                  selector: auth.identity.sub
---
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: parks-jwt-rate-limits
  namespace: rhcl-parks-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: parks-jwt
  limits:
    # Shared protection of the backend against authenticated aggregate bursts.
    # This does NOT stop network/volumetric DDoS and is not an IP-based WAF.
    aggregate:
      rates:
        - limit: 60
          window: 1m
    per-subject:
      rates:
        - limit: 5
          window: 10s
        - limit: 20
          window: 1m
      counters:
        - expression: auth.identity.userid
